name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urluser
          POSTGRES_PASSWORD: urlpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U urluser -d urlshortener"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize database
        env:
          PGPASSWORD: urlpassword
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U urluser \
            -d urlshortener \
            -c "
            CREATE TABLE IF NOT EXISTS urls (
              id SERIAL PRIMARY KEY,
              code VARCHAR(20) UNIQUE NOT NULL,
              original_url TEXT NOT NULL
            );
            "

      - name: Run tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: urlshortener
          DATABASE_USER: urluser
          DATABASE_PASSWORD: urlpassword
        run: |
          pytest

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t url-service:ci \
            -f services/url-service/Dockerfile \
            .
      
      - name: Check Docker image
        run: |
          docker images url-service:ci

  helm:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: |
          helm lint ./helm
