apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-url-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Release.Name }}-url-service
  ports:
    - port: {{ .Values.urlService.service.port }}
      targetPort: {{ .Values.urlService.service.targetPort }}
  type: {{ .Values.urlService.service.type }}
